<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#001629">

  <title>E-LOGBOOK AIRPORT SECURITY APPS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #001629;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    #app {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #001629;
    }

    #homeImage {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Area klik transparan.
      Desain asli tidak digambar ulang.
    */

    .menu-hotspot {
      position: absolute;
      z-index: 10;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-hotspot:active {
      background: rgba(255, 255, 255, 0.03);
    }

    /*
      Desktop / Monitor
    */

    @media (min-width: 1101px) {

      #dailyTestButton {
        left: 2.5%;
        top: 49%;
        width: 15.5%;
        height: 27%;
      }

      #logBookButton {
        left: 18%;
        top: 49%;
        width: 15.5%;
        height: 27%;
      }

      #formFormsButton {
        left: 33.5%;
        top: 49%;
        width: 16.5%;
        height: 27%;
      }
    }

    /*
      Tablet
    */

    @media (min-width: 601px) and (max-width: 1100px) {

      #dailyTestButton {
        left: 3%;
        top: 47%;
        width: 18%;
        height: 27%;
      }

      #logBookButton {
        left: 21.5%;
        top: 47%;
        width: 18%;
        height: 27%;
      }

      #formFormsButton {
        left: 40%;
        top: 47%;
        width: 19%;
        height: 27%;
      }
    }

    /*
      HP
    */

    @media (max-width: 600px) {

      #dailyTestButton {
        left: 2%;
        top: 53%;
        width: 31%;
        height: 21%;
      }

      #logBookButton {
        left: 34%;
        top: 53%;
        width: 31%;
        height: 21%;
      }

      #formFormsButton {
        left: 66%;
        top: 53%;
        width: 32%;
        height: 21%;
      }
    }

    /*
      Halaman menu sementara
    */

    .page {
      display: none;
      min-height: 100vh;
      padding: 40px 20px;
      background: #001629;
      color: white;
      text-align: center;
    }

    .page h1 {
      margin: 0 0 15px;
      font-size: 32px;
    }

    .page p {
      margin: 0 auto;
      max-width: 650px;
      line-height: 1.6;
      opacity: 0.85;
    }

    .back-button {
      margin-top: 28px;
      padding: 12px 28px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main id="app">

    <!-- HOME -->
    <section id="home">

      <picture>

        <!-- HP -->
        <source
          media="(max-width: 600px)"
          srcset="assets/home-hp.png"
        >

        <!-- TABLET -->
        <source
          media="(min-width: 601px) and (max-width: 1100px)"
          srcset="assets/home-tablet.png"
        >

        <!-- MONITOR -->
        <img
          id="homeImage"
          src="assets/home-monitor.png"
          alt="E-Logbook Airport Security"
        >

      </picture>


      <!-- DAILY TEST -->
      <button
        id="dailyTestButton"
        class="menu-hotspot"
        type="button"
        aria-label="Daily Test"
        onclick="openPage('DAILY TEST')">
      </button>


      <!-- LOG BOOK -->
      <button
        id="logBookButton"
        class="menu-hotspot"
        type="button"
        aria-label="Log Book"
        onclick="openPage('LOG BOOK')">
      </button>


      <!-- FORM-FORM -->
      <button
        id="formFormsButton"
        class="menu-hotspot"
        type="button"
        aria-label="Form-Form"
        onclick="openPage('FORM-FORM')">
      </button>

    </section>


    <!-- HALAMAN MENU -->
    <section id="menuPage" class="page">

      <h1 id="menuTitle"></h1>

      <p id="menuText"></p>

      <button
        class="back-button"
        type="button"
        onclick="goHome()">
        ← KEMBALI
      </button>

    </section>

  </main>


  <script>

    function openPage(menu) {

      document.getElementById('home').style.display = 'none';

      document.getElementById('menuPage').style.display = 'block';

      document.getElementById('menuTitle').textContent = menu;

      document.getElementById('menuText').textContent =
        'Halaman ' + menu + ' akan kita bangun bertahap.';

      window.scrollTo(0, 0);
    }


    function goHome() {

      document.getElementById('menuPage').style.display = 'none';

      document.getElementById('home').style.display = 'block';

      window.scrollTo(0, 0);
    }

  </script>

</body>
</html>
