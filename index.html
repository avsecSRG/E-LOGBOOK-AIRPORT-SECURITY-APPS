<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-LOGBOOK AIRPORT SECURITY APPS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* SILAKAN PASTE SEMUA CSS LAMA KAMU DI SINI, HINGGA BAGIAN @media print */
/* ... (masukkan ratusan baris CSS kamu sebelumnya di sini) ... */

/* =====================================================
   BAGIAN YANG TERPOTONG & DIPERBAIKI (PRINT MEDIA QUERY)
   ===================================================== */
@media print{
  #randomCheckFormPage { position:static; overflow:visible; background:#fff; }
  #randomCheckFormPage .vehicle-page-bg,
  #randomCheckFormPage .vehicle-overlay,
  #randomCheckFormPage .vehicle-back,
  #randomCheckFormPage .vehicle-actions { display:none!important; }
  #randomCheckFormPage .vehicle-card { width:100%; max-width:none; margin:0; border:none; box-shadow:none; }
  #randomCheckFormPage .vehicle-table-scroll { overflow:visible; }
  .random-check-table { width:100%; min-width:0; }
  .random-check-table th, .random-check-table td { font-size:8px; padding:3px; }
  
  /* Ini adalah baris terakhir kamu yang terpotong */
  .random-check-table input, 
  .random-check-table select {
    border: none;
    background: transparent;
  }
}
</style>
</head>

<body>

  <!-- LOADING SCREEN -->
  <div id="loading" class="hidden">Loading...</div>

  <!-- HOME STAGE -->
  <div id="homeStage" class="stage">
    <!-- Catatan: Tambahkan tag <img> dengan class="background" jika kamu punya gambar background menu utamanya -->
    <h2 style="color:white; text-align:center; padding-top:20px;">MENU UTAMA</h2>
    
    <!-- Tombol navigasi (posisi diatur oleh CSS kamu) -->
    <button id="homeDaily" class="click-area" style="border:1px solid #00c8ef; background:rgba(0,200,239,0.2);">Daily Test</button>
    <button id="homeLogbook" class="click-area" style="border:1px solid #00c8ef; background:rgba(0,200,239,0.2);">Logbook</button>
    <button id="homeForms" class="click-area" style="border:1px solid #00c8ef; background:rgba(0,200,239,0.2);">Forms</button>
  </div>

  <!-- DAILY TEST MENU STAGE -->
  <div id="dailyStage" class="stage">
    <h2 style="color:white; text-align:center; padding-top:20px;">MENU DAILY TEST</h2>
    <button id="btnXray" class="click-area" style="border:1px solid #00c8ef; background:rgba(0,200,239,0.2);">X-RAY</button>
    <button id="btnWtmd" class="click-area" style="border:1px solid #00c8ef; background:rgba(0,200,239,0.2);">WTMD</button>
    <button id="btnHhmd" class="click-area" style="border:1px solid #00c8ef; background:rgba(0,200,239,0.2);">HHMD</button>
    <button id="btnEtd" class="click-area" style="border:1px solid #00c8ef; background:rgba(0,200,239,0.2);">ETD</button>
    <button id="btnBackDaily" class="click-area" style="border:1px solid red; background:rgba(255,0,0,0.2);">Back</button>
  </div>

  <!-- HALAMAN FORMS KENDARAAN (Contoh UI Sub-Page) -->
  <div id="vehicleFormPage">
    <div class="vehicle-overlay"></div>
    <div class="vehicle-card">
      <div class="vehicle-title">FORM PENCATATAN KENDARAAN</div>
      <div class="vehicle-actions">
        <button class="save" onclick="alert('Data Disimpan!')">Simpan Data</button>
        <button class="delete" onclick="document.getElementById('vehicleFormPage').classList.remove('active')">Kembali</button>
      </div>
    </div>
  </div>


  <!-- LOGIKA JAVASCRIPT DASAR -->
  <script>
    // Referensi ke elemen-elemen halaman
    const homeStage = document.getElementById('homeStage');
    const dailyStage = document.getElementById('dailyStage');
    const vehicleFormPage = document.getElementById('vehicleFormPage');

    // Referensi ke tombol-tombol di HOME
    const btnHomeDaily = document.getElementById('homeDaily');
    const btnHomeForms = document.getElementById('homeForms');

    // Referensi ke tombol di DAILY TEST
    const btnBackDaily = document.getElementById('btnBackDaily');
    const btnXray = document.getElementById('btnXray');

    // 1. Menuju Halaman Daily Test
    btnHomeDaily.addEventListener('click', () => {
      homeStage.style.display = 'none';
      dailyStage.style.display = 'block';
    });

    // 2. Kembali dari Daily Test ke Home
    btnBackDaily.addEventListener('click', () => {
      dailyStage.style.display = 'none';
      homeStage.style.display = 'block';
    });

    // 3. Menuju Halaman Form Kendaraan
    btnHomeForms.addEventListener('click', () => {
      vehicleFormPage.classList.add('active');
    });

    // 4. Contoh Interaksi klik X-Ray
    btnXray.addEventListener('click', () => {
      alert("Halaman Checklist X-Ray belum dibuat body HTML-nya, tapi sistem tombolnya sudah siap!");
    });

    // Hapus layar loading setelah selesai dirender
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      if (loading) loading.classList.add('hidden');
    });
  </script>

</body>
</html>
